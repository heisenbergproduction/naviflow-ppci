<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="4" />

  <!-- Medical Cross Badge Container -->
  <g filter="url(#shadow)">
    <!-- Vertical Cross Bar -->
    <rect x="216" y="96" width="80" height="320" rx="24" fill="#ffffff" />
    <!-- Horizontal Cross Bar -->
    <rect x="96" y="216" width="320" height="80" rx="24" fill="#ffffff" />
  </g>

  <!-- Inner Cyan Accent Cross -->
  <g>
    <rect x="228" y="108" width="56" height="296" rx="16" fill="url(#crossGrad)" />
    <rect x="108" y="228" width="296" height="56" rx="16" fill="url(#crossGrad)" />
  </g>

  <!-- Dynamic ECG / Pulse Wave through center -->
  <path d="M 60 256 L 160 256 L 195 210 L 230 310 L 265 170 L 300 330 L 330 256 L 452 256"
        fill="none"
        stroke="url(#pulseGrad)"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#shadow)" />

  <!-- Central Star of Life / NAVI indicator dot -->
  <circle cx="265" cy="170" r="10" fill="#f43f5e" />
  <circle cx="300" cy="330" r="8" fill="#38bdf8" />
</svg>
